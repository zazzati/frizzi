<!doctype html><html lang="it" dir="ltr"><head><meta charset="utf-8"/><script>/* Language and direction before the first paint; mirrors detectLocale in src/lib/i18n.ts. */(function(s,l){try{l=localStorage.getItem('locale')}catch(e){}if(s.indexOf(l)<0){l='it';for(var n=navigator.languages||[],i=0;i<n.length;i++){var c=n[i].toLowerCase().split(/[-_]/)[0];if(s.indexOf(c)>=0){l=c;break}}}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr'})('it,en,es,zh,hi,ar,fr,bn,pt,ru,de'.split(','))</script><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="referrer" content="no-referrer"/><link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml"/>%sveltekit.head%</head><body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body></html>
